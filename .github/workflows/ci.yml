name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  host:
    name: Host (${{ matrix.config.name }})
    runs-on: ${{ matrix.config.os }}
    container: ${{ matrix.config.container }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: Linux GCC 13, os: ubuntu-24.04, CXX: g++ }
          - { name: Linux Clang 18, os: ubuntu-24.04, CXX: clang++-18, install_clang18: true }
          - { name: Linux GCC 15, os: ubuntu-24.04, container: 'gcc:15', CXX: g++ }
          - { name: macOS arm64 Clang, os: macos-latest, CXX: clang++ }
    steps:
      - name: Install tools in container
        if: matrix.config.container != ''
        run: apt-get update && apt-get install -y --no-install-recommends cmake

      - name: Install Clang 18
        if: matrix.config.install_clang18
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-18

      - uses: actions/checkout@v5

      - name: Test host correctness (C++17/C++14, -O2/-O3/-Os, SMALL_GEMM=0 & 1, EIGEN_NO_MALLOC)
        env:
          CXX: ${{ matrix.config.CXX }}
        run: |
          set -euo pipefail
          ${CXX} --version
          COMMON="-fno-exceptions -fno-rtti -DEIGEN_NO_MALLOC -Wall -Wextra -Wshadow -Wconversion -Wdouble-promotion -Werror -isystem ."
          mkdir -p build-host

          # Verify desktop default keeps EIGEN_MCU_SMALL_GEMM=0 so SIMD GEMM is preserved.
          ${CXX} -std=c++17 -O2 ${COMMON} -x c++ - -o build-host/check_defaults <<'EOF'
          #include <Eigen/Core>
          static_assert(EIGEN_MCU == 1, "EIGEN_MCU must be 1");
          static_assert(EIGEN_MCU_ARCH_CORTEX_M == 0, "Host must not be detected as Cortex-M");
          static_assert(EIGEN_MCU_SMALL_GEMM == 0, "Desktop SIMD host must default EIGEN_MCU_SMALL_GEMM to 0");
          int main() { return 0; }
          EOF
          ./build-host/check_defaults

          for cfg in \
            "cxx17_o2_def:-std=c++17 -O2" \
            "cxx17_o3_def:-std=c++17 -O3" \
            "cxx17_o3_mcu:-std=c++17 -O3 -DEIGEN_MCU_SMALL_GEMM=1" \
            "cxx17_os_mcu:-std=c++17 -Os -DEIGEN_UNROLLING_LIMIT=0 -DEIGEN_MCU_SMALL_GEMM=1" \
            "cxx14_o2_mcu:-std=c++14 -O2 -DEIGEN_MCU_SMALL_GEMM=1"
          do
            name="${cfg%%:*}"
            flags="${cfg#*:}"
            echo "=== Building & running ${name} (${flags}) ==="
            ${CXX} ${flags} ${COMMON} test_mcu/test_mcu_kernels.cpp -o "build-host/${name}"
            "./build-host/${name}"
          done

      - name: Verify CMake install and find_package(Eigen3)
        env:
          CXX: ${{ matrix.config.CXX }}
        run: |
          set -euo pipefail
          cmake -S . -B build-cmake \
            -DBUILD_TESTING=OFF -DEIGEN_BUILD_BLAS=OFF -DEIGEN_BUILD_LAPACK=OFF \
            -DEIGEN_BUILD_DOC=OFF -DEIGEN_BUILD_DEMOS=OFF \
            -DCMAKE_INSTALL_PREFIX="$PWD/build-install"
          cmake --install build-cmake
          test -f "$PWD/build-install/include/eigen3/Eigen/Core"
          test -f "$PWD/build-install/include/eigen3/Eigen/src/Core/util/McuConfig.h"
          mkdir -p build-consumer-src
          cat > build-consumer-src/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.14)
          project(eigen_mcu_consumer LANGUAGES CXX)
          find_package(Eigen3 5.0.1 EXACT REQUIRED NO_MODULE)
          add_executable(app main.cpp)
          target_link_libraries(app PRIVATE Eigen3::Eigen)
          target_compile_features(app PRIVATE cxx_std_17)
          EOF
          cat > build-consumer-src/main.cpp <<'EOF'
          #include <Eigen/Core>
          static_assert(EIGEN_MCU == 1, "EIGEN_MCU expected");
          static_assert(EIGEN_VERSION_AT_LEAST(5, 0, 1), "Eigen 5.0.1 expected");
          int main() {
            Eigen::Matrix<float, 4, 4> A = Eigen::Matrix<float, 4, 4>::Identity();
            Eigen::Matrix<float, 4, 1> x(1.0f, 2.0f, 3.0f, 4.0f);
            return ((A * x - x).norm() == 0.0f) ? 0 : 1;
          }
          EOF
          cmake -S build-consumer-src -B build-consumer -DCMAKE_CXX_COMPILER="${CXX}" -DCMAKE_PREFIX_PATH="$PWD/build-install"
          cmake --build build-consumer
          ./build-consumer/app

  cortex-m:
    name: Cortex-M4F & M7 QEMU Correctness and Performance Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Install Arm GCC toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib qemu-system-arm

      - name: Run Cortex-M4F/M7 correctness, zero-heap, zero-FP64, and performance regression gate
        run: python3 test_mcu/check_mcu.py --jobs 4

  downstream-ukf:
    name: Downstream sfwa/ukf (Release Archive)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Package eigen-mcu archive
        run: bash scripts/package_release.sh --out "$PWD/dist" --verify

      - name: Check out public sfwa/ukf
        uses: actions/checkout@v5
        with:
          repository: sfwa/ukf
          path: ukf

      - name: Build and test sfwa/ukf (double, single, examples, EIGEN_NO_MALLOC)
        run: |
          set -euo pipefail
          ARCHIVE="$(ls "$PWD"/dist/eigen-mcu-*.tar.gz)"
          VERSION="$(sed -n 's/^#define EIGEN_VERSION_STRING "\(.*\)"$/\1/p' Eigen/Version)"
          cmake -S ukf -B build-ukf -DCMAKE_BUILD_TYPE=Debug \
            -DUKF_EIGEN_VERSION="${VERSION}" -DUKF_EIGEN_URL="${ARCHIVE}"
          cmake --build build-ukf --target unittest unittest_single ukf_examples --parallel 4
          ctest --test-dir build-ukf --output-on-failure

      - name: Build and test sfwa/ukf consumer fixture with EIGEN_MCU_SMALL_GEMM=1
        run: |
          set -euo pipefail
          ARCHIVE="$(ls "$PWD"/dist/eigen-mcu-*.tar.gz)"
          VERSION="$(sed -n 's/^#define EIGEN_VERSION_STRING "\(.*\)"$/\1/p' Eigen/Version)"
          cmake -S ukf/test/cmake -B build-ukf-consumer -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-DEIGEN_MCU_SMALL_GEMM=1" \
            -DUKF_EIGEN_VERSION="${VERSION}" -DUKF_EIGEN_URL="${ARCHIVE}"
          cmake --build build-ukf-consumer --parallel 4
          ctest --test-dir build-ukf-consumer --output-on-failure

  downstream-nmpc:
    name: Downstream sfwa/nmpc (Host + Cortex-M7 QEMU)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install Arm GCC toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib qemu-system-arm

      - name: Package eigen-mcu archive
        run: bash scripts/package_release.sh --out "$PWD/dist" --verify

      - name: Check out public sfwa/nmpc
        uses: actions/checkout@v5
        with:
          repository: sfwa/nmpc
          path: nmpc

      - name: Build and test sfwa/nmpc on host (EIGEN_MCU_SMALL_GEMM=1)
        run: |
          set -euo pipefail
          ARCHIVE="$(ls "$PWD"/dist/eigen-mcu-*.tar.gz)"
          VERSION="$(sed -n 's/^#define EIGEN_VERSION_STRING "\(.*\)"$/\1/p' Eigen/Version)"
          cmake -S nmpc -B build-nmpc -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-DEIGEN_MCU_SMALL_GEMM=1" \
            -DNMPC_EIGEN_VERSION="${VERSION}" -DNMPC_EIGEN_URL="${ARCHIVE}"
          cmake --build build-nmpc --target unittest unittest_no_heap stop pendulum attitude --parallel 4
          ctest --test-dir build-nmpc --output-on-failure
          ./build-nmpc/examples/stop/stop
          ./build-nmpc/examples/pendulum/pendulum
          ./build-nmpc/examples/attitude/attitude

      - name: Run sfwa/nmpc Cortex-M7 QEMU benchmark (-O2 and -Os -U0) with zero-FP64 and regression check
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess, sys

          root = pathlib.Path(os.getcwd())
          nmpc = root / "nmpc"
          bench_dir = nmpc / "benchmark" / "cortex-m7"
          baseline_all = json.loads((bench_dir / "accepted.json").read_text())
          ver_line = subprocess.run(["arm-none-eabi-gcc", "--version"], check=True, capture_output=True, text=True).stdout.splitlines()[0]
          compiler = ver_line.split(")")[-1].strip().split()[0]
          baseline = baseline_all.get(compiler, {})
          double_re = re.compile(r"__aeabi_(d[a-z0-9]+|[a-z0-9]+2d)\b")
          count_re = re.compile(r"^(.+?): (\d+) instructions, stack (\d+) bytes$")

          summary = [f"## Downstream `sfwa/nmpc` Cortex-M7 QEMU (`arm-none-eabi-gcc {compiler}`)\n"]
          failures = []

          for label, opt in [("O2", "-O2"), ("Os-U0", "-Os -DEIGEN_UNROLLING_LIMIT=0")]:
              out_dir = root / f"build-nmpc-m7-{label}"
              env = os.environ.copy()
              env["OPT"] = opt
              res = subprocess.run([str(bench_dir / "build.sh"), str(root), str(out_dir)], env=env, capture_output=True, text=True)
              sys.stdout.write(f"=== nmpc Cortex-M7 ({label}) ===\n{res.stdout}\n")
              if res.returncode != 0:
                  sys.stderr.write(res.stderr)
                  sys.exit(1)
              if res.stdout.count("all solves usable") != 2:
                  failures.append(f"nmpc {label}: not all solves usable")
              undef = "".join(
                  subprocess.run(["arm-none-eabi-nm", "-u", str(out_dir / obj)], check=True, capture_output=True, text=True).stdout
                  for obj in ("main.o", "main_per_stage.o")
              )
              fp64 = sorted(set(double_re.findall(undef)))
              if fp64:
                  failures.append(f"nmpc {label}: FP64 symbols called: {', '.join('__aeabi_' + s for s in fp64)}")

              counts = {}
              for line in res.stdout.splitlines():
                  m = count_re.match(line.strip())
                  if m:
                      counts[m.group(1)] = int(m.group(2))

              summary.append(f"### `{label}`\n")
              summary.append("| Metric | Measured | 3.2.8 Baseline | Delta |")
              summary.append("| --- | ---: | ---: | ---: |")
              for name in sorted(counts):
                  val = counts[name]
                  if name.startswith("first solve") and val > 10**15:
                      # Upstream nmpc startup.c does not wait for SysTick's first reload
                      # after timer_start(), which can underflow uint64_t on first solve.
                      summary.append(f"| `{name}` | (SysTick init wrap) | — | — |")
                      continue
                  if label == "O2" and name in baseline:
                      base = baseline[name]
                      delta = (val - base) / base
                      summary.append(f"| `{name}` | {val:,} | {base:,} | {delta:+.1%} |")
                      if delta > 0.03:
                          failures.append(f"nmpc O2 regression on {name}: {val} vs {base} ({delta:+.1%})")
                  else:
                      summary.append(f"| `{name}` | {val:,} | — | — |")
              summary.append("")

          step_summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if step_summary:
              with open(step_summary, "a", encoding="utf-8") as fh:
                  fh.write("\n".join(summary) + "\n")

          if failures:
              for f in failures:
                  print("FAIL:", f, file=sys.stderr)
              sys.exit(1)
          print("PASS: downstream sfwa/nmpc Cortex-M7 checks succeeded.")
          PY

  release-package:
    name: Release Archive and License Verification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Verify version, licenses, archive packaging, and CMake install
        run: |
          set -euo pipefail
          TAG_ARG=()
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG_ARG=(--tag "${GITHUB_REF_NAME}")
          fi
          bash scripts/package_release.sh --out "$PWD/dist" --verify "${TAG_ARG[@]}"

      - name: Upload release tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: eigen-mcu-release-archive
          path: |
            dist/eigen-mcu-*.tar.gz
            dist/eigen-mcu-*.tar.gz.sha256
          if-no-files-found: error
